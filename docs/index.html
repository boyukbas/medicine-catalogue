<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>İlaç Kataloğu</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="locked">
  <header class="top">
    <button id="menu" class="icon-btn" data-i18n-label="menu" aria-controls="side" aria-expanded="false">☰</button>
    <h1 data-i18n="title">İlaç Kataloğu</h1>
    <span class="sub" data-i18n="sub">Özlem için</span>
    <div class="langs" role="group" aria-label="Dil / Language / Sprache">
      <button type="button" data-lang="tr" lang="tr">TR</button>
      <button type="button" data-lang="en" lang="en">EN</button>
      <button type="button" data-lang="de" lang="de">DE</button>
    </div>
    <a id="learnBtn" class="lock-btn learn-btn" href="#/learn" data-i18n="learn" hidden>Öğren</a>
    <button id="lock" class="lock-btn" type="button" data-i18n="lock" hidden>Kilitle</button>
  </header>

  <section id="gate" class="gate" hidden>
    <form id="gateForm" class="gate-card" autocomplete="on">
      <h2 data-i18n="gateTitle">Bu katalog parola ile korunuyor</h2>
      <label for="pw" data-i18n="password">Parola</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required>
      <label class="remember"><input id="remember" type="checkbox"> <span data-i18n="remember">Bu cihazda hatırla</span></label>
      <button id="unlock" type="submit" data-i18n="open">Aç</button>
      <p id="gateMsg" class="gate-msg" aria-live="polite"></p>
    </form>
  </section>

  <div class="layout">
    <aside id="side" class="side">
      <div class="tools">
        <input id="filter" type="search" data-i18n-ph="filter" autocomplete="off" spellcheck="false">
        <button id="collapse" type="button" data-i18n="collapse">Tümünü daralt</button>
      </div>
      <label class="common-only"><input id="commonOnly" type="checkbox" checked> <span data-i18n="commonOnly">Yalnızca sık kullanılanlar</span></label>
      <p id="status" class="status" aria-live="polite"></p>
      <nav id="tree" class="tree" role="tree"></nav>
    </aside>
    <main class="main">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="panels" class="panels">
        <section id="welcome" class="welcome">
          <h2 data-i18n="welcomeTitle">Hoş geldiniz</h2>
          <p data-i18n="welcome1"></p>
          <p class="muted" data-i18n="welcome2"></p>
          <p class="muted" id="sourceDates"></p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
